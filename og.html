<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>OG render — IntegrateAI</title>
  <link rel="stylesheet" href="/assets/styles.v1.css">
  <style>
    /* Fixed social-card canvas. 1200×630 is a wide short box, so --grad-page
       would read cold — reuse the legal-hero re-weighting (golden source
       top-left, slate held to the far corner). */
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .og {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background:
        radial-gradient(115% 150% at 10% -10%,
          rgba(255,244,220,.85) 0%, rgba(243,228,190,.32) 32%, rgba(243,228,190,0) 64%),
        radial-gradient(52% 80% at 79% 50%,
          rgba(255,244,220,.32) 0%, rgba(243,228,190,.14) 40%, rgba(243,228,190,0) 70%),
        linear-gradient(302deg,
          #7C8AA5 0%, #A9B4C6 13%, #C7CEDA 28%, #E8E2D6 56%, #F2EDE3 80%, #F7F3EA 100%);
    }
    .og__copy {
      position: absolute; left: 72px; top: 0; bottom: 0; width: 560px;
      display: flex; flex-direction: column; justify-content: center; z-index: 5;
    }
    .og__brand {
      display: flex; align-items: center; gap: 14px;
      font: 600 27px/1 var(--sans); letter-spacing: -.01em; color: var(--ink);
      margin-bottom: 44px;
    }
    .og__brand svg { width: 34px; height: 34px; }
    .og h1 { font-size: 67px; margin-bottom: 30px; max-width: 8.4em; }
    .og .lead { font-size: 25.5px; line-height: 1.5; color: var(--ink-soft); max-width: 21em; }
    .og__url {
      position: absolute; left: 72px; bottom: 46px; z-index: 5;
      font: 600 16px/1 var(--sans); letter-spacing: .13em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .og__network {
      position: absolute; right: -8px; top: 50%; transform: translateY(-50%);
      width: 640px; z-index: 2;
    }
    .og__network svg { width: 100%; height: auto; }
  </style>
</head>
<body>

</div>
